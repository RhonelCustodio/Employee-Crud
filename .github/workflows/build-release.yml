name: Build Windows app

# Runs on every push to main/master. When you push a version tag (v1.0.0),
# it also creates a GitHub Release with a ready-to-run .exe attached.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:   # allows manual runs from the Actions tab

permissions:
  contents: write     # required for the release step to attach the zip

jobs:
  build:
    # WPF is Windows-only, so the runner must be Windows.
    runs-on: windows-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Optional gate: runs the 23 repository smoke tests before publishing.
      # Delete this step if you do not want tests to block a build.
      - name: Run repository smoke tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem -Recurse -Filter RepositorySmokeTests.csproj | Select-Object -First 1
          if ($tests) { dotnet run --project $tests.FullName }

      # Locates the project file wherever it sits in the repo, so this works
      # whether the repo root is the EmployeeCrud folder itself or a parent.
      - name: Publish self-contained Windows build
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter EmployeeCrud.csproj | Select-Object -First 1
          dotnet publish $proj.FullName `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish

      - name: Zip the published app
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath EmployeeCrud-win-x64.zip

      - name: Upload the zip as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmployeeCrud-win-x64
          path: EmployeeCrud-win-x64.zip
          if-no-files-found: error

      # Only runs for tag pushes (v1.0.0, v1.1.0, ...): creates the GitHub
      # Release and attaches the zip to it.
      - name: Attach the zip to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EmployeeCrud-win-x64.zip
          generate_release_notes: true
